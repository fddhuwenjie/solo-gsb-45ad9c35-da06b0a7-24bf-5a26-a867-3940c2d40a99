services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DB_PATH=/data/blindreview.db
    volumes:
      - blindreview-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  blindreview-data:
